name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - name: Parse PowerShell manager
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/manager.ps1", [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors) { throw ($parseErrors | Out-String) }
      - name: Check Windows manager before installation
        shell: pwsh
        run: |
          $result = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\manager.ps1 -Action status 2>&1
          if ($LASTEXITCODE -notin @(1, 77)) { throw "Unexpected manager exit: $LASTEXITCODE" }
          if (($result | Out-String) -notmatch 'not installed|Administrator privileges required') {
            throw ($result | Out-String)
          }
      - name: Smoke test installed CLI and Windows adapters
        env:
          PYTHONPATH: ""
        run: |
          mirrormate --version
          mirrormate list --json
          mirrormate status --json
          mirrormate set python --mirror pypi-official --dry-run
          mirrormate set npm --mirror npm-official --dry-run
          mirrormate set go --mirror go-official --dry-run

  macos:
    runs-on: macos-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m unittest discover -s tests -v
      - run: python -m venv /tmp/mirrormate-venv
      - run: /tmp/mirrormate-venv/bin/python -m pip install .
      - name: Smoke test installed package
        env:
          PYTHONPATH: ""
        run: |
          /tmp/mirrormate-venv/bin/mirrormate --version
          /tmp/mirrormate-venv/bin/mirrormate list --json
          /tmp/mirrormate-venv/bin/mirrormate status --json

  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - run: bash -n script.sh install.sh manager-mac.sh manager-linux.sh scripts/build-deb.sh
      - run: sh scripts/build-deb.sh
      - run: dpkg-deb --info dist/mirrormate_all.deb

  package-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
          - debian:12
          - debian:13
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/build-deb.sh
      - name: Install and smoke test
        run: |
          docker run --rm \
            -v "$PWD/dist/mirrormate_all.deb:/tmp/mirrormate.deb:ro" \
            "${{ matrix.image }}" \
            sh -c 'apt-get update && apt-get install -y /tmp/mirrormate.deb && mirrormate --version && mirrormate list --json'
