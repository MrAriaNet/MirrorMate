name: Release package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: macos-latest
            python: "3.10"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - name: Validate PowerShell manager
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/manager.ps1", [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors) { throw ($parseErrors | Out-String) }
      - name: Validate shell managers
        if: runner.os != 'Windows'
        run: bash -n install.sh manager-linux.sh manager-mac.sh scripts/build-deb.sh

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Validate version and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n 1)
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Tag must be v$PACKAGE_VERSION" >&2
            exit 1
          fi
          test -s ".github/release-notes/$RELEASE_TAG.md"
      - name: Build Debian and Python packages
        run: |
          sh scripts/build-deb.sh
          python -m pip install build
          python -m build
          cp manager-linux.sh manager-mac.sh manager.ps1 install.sh dist/
          cd dist
          sha256sum ./*.whl ./*.tar.gz > python-packages.sha256
      - uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-notes/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            dist/mirrormate_all.deb
            dist/mirrormate_all.deb.sha256
            dist/*.whl
            dist/*.tar.gz
            dist/python-packages.sha256
            dist/manager-linux.sh
            dist/manager-mac.sh
            dist/manager.ps1
            dist/install.sh
