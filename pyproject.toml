[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mirrormate"
version = "2.1.0"
description = "Safe mirror switcher for APT, PyPI, NPM, Go, Docker, and Homebrew"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "MirrorMate contributors" }]
keywords = ["mirror", "apt", "pypi", "npm", "golang", "docker", "homebrew"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console :: Curses",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
]
dependencies = ["windows-curses>=2.4; sys_platform == 'win32'"]

[project.urls]
Homepage = "https://github.com/free-programmers/MirrorMate"
Repository = "https://github.com/free-programmers/MirrorMate"
Issues = "https://github.com/free-programmers/MirrorMate/issues"
Changelog = "https://github.com/free-programmers/MirrorMate/blob/main/CHANGELOG.md"

[project.scripts]
mirrormate = "mirrormate.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mirrormate = ["data/*.json"]
